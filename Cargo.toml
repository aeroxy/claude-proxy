[package]
name = "claude-proxy"
version = "0.8.0"
edition = "2021"
rust-version = "1.82"
authors = ["Aero <aero.windwalker@gmail.com>"]
license = "MIT"
description = "Local HTTPS MITM proxy for the claude CLI — caches OAuth tokens and short-circuits Vertex AI heat-up requests"
repository = "https://github.com/aero/claude-proxy"
homepage = "https://github.com/aero/claude-proxy"
readme = "README.md"
keywords = ["proxy", "claude", "anthropic", "oauth", "mitm"]
categories = ["command-line-utilities", "network-programming"]
include = [
    "src/**/*.rs",
    "src/**/*.json",
    "/Cargo.toml",
    "/README.md",
]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
daemonize = "0.5"
dirs = "6.0.0"
nix = { version = "0.29", features = ["signal"] }
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["full"] }
hyper-util = { version = "0.1.20", features = ["full"] }
lazy_static = "1.5.0"
rand = "0.10.1"
rcgen = { version = "0.11", features = ["pem", "x509-parser"] }
reqwest = { version = "0.13.3", features = ["rustls", "json", "socks", "form", "stream"] }
rustls = "0.23.40"
rustls-pki-types = "1.14.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10"
md-5 = "0.10"
regex = "1"
flate2 = "1"
tokio = { version = "1.52.1", features = ["full"] }
tokio-rustls = "0.26.4"
tokio-stream = "0.1"
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
