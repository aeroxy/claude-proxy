# Listening port. Defaults to 7777; overridden by the `--port` CLI flag.
# port = 7000

upstream_proxy = "http://localhost:9090"

# General settings. Both optional; the defaults below are what you get by omitting
# the whole table.
# [settings]
# Where credentials are read from, in order (ours first, then CLIProxyAPI's).
# auth_dirs = ["~/.config/claude-proxy/auths", "~/.cli-proxy-api"]
# Per-provider catalog for the GET /v1beta/models listing, used as a fallback when
# a provider's live fetch fails or isn't permitted. Shape:
#   { "gemini-cli": [{"id": "...", "display_name": "...", "inputTokenLimit": 1048576}], "aicode": [...] }
# models_file = "~/.config/claude-proxy/models.json"

[[map_local]]
url    = "https://*.datadoghq.com/api/v2/logs"
method = "POST"
status = 202
body   = "{}"

# Plain HTTP works too — useful for internal telemetry endpoints.
[[map_local]]
url    = "http://192.168.0.1/x/y/z"
method = "POST"
body   = "{}"

# Anthropic event-logging batches — pretend the server accepted everything.
[[map_local]]
url    = "https://api.anthropic.com/api/event_logging/v2/batch"
method = "POST"
body   = '{"accepted_count":100,"rejected_count":0}'

# Claude Code update check — return 200 with no body and no Content-Type header.
[[map_local]]
url    = "https://downloads.claude.ai/claude-code-releases/latest"
method = "GET"

# OpenAI Chat Completions aggregator (origin mode: OPENAI_BASE_URL=http://127.0.0.1:7777).
# Each [[openai]] entry is an OpenAI-compatible backend selected by a provider prefix on
# the model. Routing splits the model on the FIRST `/`: the head is the `name` below; the
# remainder is forwarded verbatim as the upstream `model`. No format translation — pure pipe.
#   e.g. model "opengateway/minimax/minimax-m3" -> provider "opengateway", upstream "minimax/minimax-m3"
[[openai]]
name     = "opengateway"                      # the provider prefix
base_url = "https://opengateway.example/v1"   # POSTed to {base_url}/chat/completions
api_key  = "sk-..."                           # optional; if omitted, the client's own
                                              # Authorization header is forwarded instead

  [openai.headers]                            # optional extra upstream headers
  X-Title = "claude-proxy"

[[openai]]
name     = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key  = "sk-or-v1-..."

# Claude subscription passthrough: serve /v1/messages against the REAL Anthropic
# API using the Claude Code OAuth credential from the macOS Keychain (service
# "Claude Code-credentials"), so any Anthropic-API client can use your Claude
# subscription without an sk-ant-api... billing key.
#
#   Origin mode: ANTHROPIC_BASE_URL=http://127.0.0.1:7777
#   MITM mode:   only models carrying the `claude-oauth/` prefix are routed here,
#                so the real `claude` CLI is never hijacked.
#
# Every field has a working default — an empty `[claude_oauth]` table is enough.
# Omit the table entirely to disable the surface.
[claude_oauth]
# Model prefix for explicit routing (`claude-oauth/claude-opus-5`). Over MITM this
# is the ONLY way traffic reaches this surface.
prefix = "claude-oauth"

# Serve unprefixed real model names (`claude-opus-5`) on the plain-HTTP origin
# branch. Never applies to MITM. Models the Gemini surface would serve are left
# to it.
serve_unprefixed = true

# `cc_version` in the injected billing system block, and the `claude-cli/<v>`
# user-agent (which uses only the leading major.minor.patch).
cli_version = "2.1.221.9b8"

# `cc_entrypoint` in the billing block. "cli" pairs with the plain identity
# prompt; anything else pairs with the Claude Agent SDK variant.
entrypoint = "cli"

# Merge refreshed tokens back into the Keychain item. On by default: Anthropic
# rotates the refresh token, so keeping ours private would eventually invalidate
# the real Claude Code login. The write preserves mcpOAuth / pluginSecrets /
# organizationUuid.
write_back = true

# The `anthropic-beta` header, sent verbatim on every request. NOT unioned with
# the client's — Anthropic 400s on values it doesn't recognize. If a client needs
# a beta, add it here. `fallback-credit-2026-06-01` is deliberately absent: it
# appears to authorize spending API credits once the subscription quota is gone.
# betas = ["oauth-2025-04-20", "claude-code-20250219", ...]

# Model aliases, applied after the prefix is stripped.
[claude_oauth.model_map]
"claude-3-5-sonnet-latest" = "claude-sonnet-5"

# Escape hatch: raw JSON merged into the request body. Use it for CLI-fidelity
# fields the proxy deliberately does not invent (they change generation behavior,
# so the client has to ask). Client-supplied values always win.
# [claude_oauth.inject]
# context_management = { edits = [{ type = "clear_thinking_20251015", keep = "all" }] }
# output_config = { effort = "high" }

# Gemini Enterprise / AntiGravity team coding seat over the `businessaicode`
# API, served as a fourth provider prefix (`aicode/<experience>`) on both
# /v1beta and /v1/messages. It has no login of its own — it borrows a stored
# `gemini-cli` credential (`claude-proxy login gemini`) and spends a corporate
# seat per call.
#
# Only `account_email` names something nothing else can supply. The licence's
# project, location and tier are discovered from `:fetchLicenses`; the fields
# below are overrides for when discovery is unavailable or ambiguous.
# Omit the table entirely to disable the provider — `aicode/*` then 404s.
[aicode]
# Which stored gemini credential holds the seat. Required whenever more than one
# is on disk: the scan order is a filesystem walk, and picking wrong could spend
# another organisation's licence, so an ambiguous choice is refused, not guessed.
account_email = "you@example.com"

# Licence project. Discovered; set it to disambiguate an account holding several
# licences (a single account can hold e.g. a prod/us/plus and a dev/global/standard
# seat at once), or to skip discovery entirely.
# project = "my-gemini-enterprise-project"

# Licence location. Part of the upstream HOSTNAME: `global` uses the bare host,
# anything else `businessaicode.<region>.rep.googleapis.com`. A regional licence
# sent to the global host is a 403, not a redirect — so this is never guessed.
# region = "us"

# `entitlement.userTier`: "gcp-ge-plus-tier" or "gcp-ge-standard-tier". Mandatory
# upstream; optional here only because it is discoverable. A wrong value returns
# the same 403 text as a wrong region or a wrong account.
# user_tier = "gcp-ge-plus-tier"
#
# There is no experience list here, and none is fetched: the seat's catalogue is
# only readable with a workforce-federated token, whose refresh dies within
# hours. `GET /v1beta/models` renders aicode from `[settings] models_file` under
# an "aicode" key. Cosmetic either way — routing is prefix-based, so an unlisted
# experience still works when named.

# Content compression settings per downstream provider.
# Provider name matches:
# - The provider prefix on the model for OpenAI (e.g. "opengateway/...")
# - The provider prefix for Gemini/Anthropic paths ("gemini-cli", "antigravity", "aicode")
# - "vertex" for Vertex AI Anthropic requests matching the URL path
# Providers not listed get no compression.
[compress.providers.gemini-cli]
max_tool_chars  = 12000  # Hard cap on characters per tool result, 0 to disable
smart_crusher   = true   # Run SmartCrusher on JSON array tool results
bias            = 1.0    # Optional bias multiplier on adaptive sizing (>1 = keep more, <1 = compress harder)

[compress.providers.antigravity]
max_tool_chars  = 8000
smart_crusher   = true
bias            = 1.0

[compress.providers.aicode]
max_tool_chars  = 8000
smart_crusher   = true
bias            = 1.0

[compress.providers.vertex]
max_tool_chars  = 8000
smart_crusher   = true
bias            = 1.0

[compress.providers.opengateway]
max_tool_chars  = 6000
smart_crusher   = false

# Opt-in redirect of specific real Anthropic model names to a Gemini upstream
# when intercepting api.anthropic.com. Key = exact `model` string the client
# sends (e.g. what the real `claude` CLI requests); value = a normal
# provider-prefixed model. Empty/absent by default -- no entries means no
# change in behavior; only listed models are ever redirected away from the
# real Anthropic API.
[anthropic_model_map]
"claude-sonnet-5" = "gemini-cli/gemini-3.5-flash"

